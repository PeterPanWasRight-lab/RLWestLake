[project]
name = "continuous-mountain-world"
version = "0.1.0"
description = "连续矩形世界强化学习环境"
requires-python = ">=3.8"
dependencies = [
    "gymnasium>=0.26.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[project.optional-dependencies]
dev = [
    "scipy>=1.7.0",
    "torch>=1.9.0",
    "tensorflow>=2.6.0",
]